<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a5c3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rahmat Chef">
  <title>Rahmat Chef</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf8f4; font-family: 'Inter', -apple-system, sans-serif; }
    .ms { font-family: 'Material Symbols Rounded'; font-variation-settings: 'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; user-select: none; font-size: 24px; line-height: 1; display: inline-block; }
    .ms-line { font-family: 'Material Symbols Rounded'; font-variation-settings: 'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; user-select: none; font-size: 24px; line-height: 1; display: inline-block; }
    #splash { position: fixed; inset: 0; background: #1a5c3a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity .5s; }
    #splash-name { font-size: 24px; font-weight: 800; color: white; font-family: 'Inter', sans-serif; letter-spacing: -0.5px; }
    #splash-sub { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 6px; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <div id="splash">
    <div style="width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:white;margin-bottom:14px;font-family:Inter">R</div>
    <div id="splash-name">Rahmat Chef</div>
    <div id="splash-sub">Sweet Pastry</div>
  </div>
  <div id="root"></div>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const s = document.getElementById('splash');
        if (s) { s.style.opacity='0'; setTimeout(()=>s.remove(),500); }
      }, 1200);
    });
  </script>
</body>
</html>
